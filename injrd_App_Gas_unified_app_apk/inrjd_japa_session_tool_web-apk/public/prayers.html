<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#fdf6ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Prayers - ISKCON NRJD</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #fdf6ec;
        --ink: #1e1008;
        --ink-soft: #8f6b45;
        --gold: #b8690e;
        --glass: rgba(253, 246, 236, 0.86);
        --glass-border: rgba(196, 130, 30, 0.22);
        --f-sacred: "Cinzel", Georgia, serif;
        --f-ui: "Nunito", "Segoe UI", sans-serif;
        --st: env(safe-area-inset-top, 0px);
        --sb: env(safe-area-inset-bottom, 0px);
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--f-ui);
        background: var(--cream);
        color: var(--ink);
      }

      #app {
        height: 100%;
        display: grid;
        grid-template-rows: 1fr calc(60px + var(--sb));
      }

      #topbar {
        display: none;
      }

      #brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #badge {
        width: clamp(48px, 9vw, 64px);
        height: clamp(48px, 9vw, 64px);
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 3px 12px rgba(212, 134, 15, 0.3);
        flex-shrink: 0;
      }

      #brand-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      #brand-name {
        font-family: var(--f-sacred);
        font-size: clamp(0.62rem, 1.4vw, 0.82rem);
        font-weight: 700;
        color: #c57514;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #brand-sub {
        font-size: clamp(0.48rem, 0.9vw, 0.62rem);
        color: var(--ink-soft);
      }

      #screen-tag {
        font-family: var(--f-sacred);
        font-size: 0.58rem;
        letter-spacing: 0.08em;
        font-weight: 700;
        color: var(--gold);
        text-transform: uppercase;
      }

      #iframe-wrap {
        min-height: 0;
        overflow: hidden;
        position: relative;
        background: linear-gradient(180deg, #fff9ef 0%, #fdf6ec 100%);
      }

      #gas-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: #fff;
      }

      #bottom-nav {
        height: calc(60px + var(--sb));
        padding: 6px 0 var(--sb);
        background: var(--glass);
        border-top: 1px solid var(--glass-border);
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        align-items: center;
        box-shadow: 0 -4px 12px rgba(120, 60, 0, 0.1);
      }

      .nav-item {
        text-decoration: none;
        color: #8d5524;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 0.52rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .nav-icon {
        font-size: 1.1rem;
        line-height: 1;
      }

      .nav-item.active {
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="iframe-wrap">
        <iframe
          id="gas-frame"
          title="Prayers"
          src="https://script.google.com/macros/s/AKfycbwx9Gdxw9GshzqyojCrlPLaF-AClhjqdj_SaN5ZxhZn_jQWoMoJjRkB-UdmXX0o7k99Tg/exec"
          allow="fullscreen"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation-by-user-activation"
        ></iframe>
      </main>

      <div id="bottom-nav">
        <a href="prayers.html" class="nav-item active">
          <div class="nav-icon">🙏</div>
          <div class="nav-label">Prayers</div>
        </a>
        <a href="attendance.html" class="nav-item">
          <div class="nav-icon">🎤</div>
          <div class="nav-label">Attendance</div>
        </a>
        <a href="index.html" class="nav-item">
          <div class="nav-icon">📿</div>
          <div class="nav-label">Session</div>
        </a>
        <a href="counter.html" class="nav-item">
          <div class="nav-icon">🔢</div>
          <div class="nav-label">Counter</div>
        </a>
        <a href="stopwatch.html" class="nav-item">
          <div class="nav-icon">⏱️</div>
          <div class="nav-label">Stopwatch</div>
        </a>
      </div>
    </div>

    <script>
      const iframe = document.getElementById('gas-frame');

      // Intercept top-level navigation triggered by the GAS iframe.
      // When a prayer button is clicked, GAS tries to navigate the top-level
      // window (via allow-top-navigation-by-user-activation). We catch that
      // navigation and redirect the URL back into the iframe src instead,
      // keeping prayers.html — and the bottom nav — alive.
      if (window.navigation) {
        // Modern Navigation API (Chrome 102+ / Android WebView API 32+)
        navigation.addEventListener('navigate', (e) => {
          const url = e.destination.url;
          if (url.includes('script.google.com') || url.includes('googleusercontent.com')) {
            e.preventDefault();
            iframe.src = url;
          }
        });
      } else {
        // Fallback: catch beforeunload, save target, return to this page
        // and load the target URL in the iframe.
        window.addEventListener('beforeunload', () => {
          sessionStorage.setItem('gas_redirect', window.__gasRedirectUrl || '');
        });
        // Override location setter to intercept GAS navigation
        const _locProto = Object.getOwnPropertyDescriptor(window, 'location');
        try {
          Object.defineProperty(window, 'location', {
            get: () => _locProto ? _locProto.get.call(window) : location,
            set: (url) => {
              if (url && (String(url).includes('script.google.com') || String(url).includes('googleusercontent.com'))) {
                iframe.src = url;
              } else {
                window.__gasRedirectUrl = url;
                if (_locProto && _locProto.set) _locProto.set.call(window, url);
              }
            }
          });
        } catch (err) { /* non-configurable in some environments */ }
      }

      iframe.addEventListener('load', () => {
        console.log('Prayers iframe loaded:', iframe.src);
      });
    </script>
  </body>
</html>
