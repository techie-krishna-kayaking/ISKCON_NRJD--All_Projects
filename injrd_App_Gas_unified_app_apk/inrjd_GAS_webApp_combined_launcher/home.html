<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #fff8ee;
      --bg2: #f6efe1;
      --card: #ffffff;
      --line: #e9d8bd;
      --text: #3a2b1c;
      --accent: #b55f09;
      --accent-2: #2d6d98;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Jost', sans-serif;
      background: radial-gradient(circle at top right, #ffe9c7 0%, transparent 42%),
                  linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--text);
      padding: 0;
    }

    .header {
      padding: 18px 14px;
      text-align: center;
      background: linear-gradient(180deg, #fff7eb 0%, #ffe8c8 100%);
      border-bottom: 1px solid #f0d4a8;
      box-shadow: 0 2px 10px rgba(180, 120, 40, 0.1);
      position: relative;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #f5b041 0%, #e67e22 45%, #f39c12 100%);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .header-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .header-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #b8600a;
      margin-bottom: 6px;
    }

    .header-logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid #f0d4a8;
      padding: 4px;
      box-shadow: 0 2px 8px rgba(180, 120, 40, 0.16);
      flex-shrink: 0;
    }

    .page-wrap {
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .shell {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 20px 36px rgba(74, 39, 10, 0.14);
      padding: 28px;
    }

    .page-title {
      margin: 0;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.06em;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: #7b3f00;
      text-align: center;
    }

    .subtitle {
      margin: 8px 0 24px;
      text-align: center;
      color: #77552e;
      font-size: 0.98rem;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .app-btn {
      display: block;
      width: 100%;
      text-decoration: none;
      background: #fffdfa;
      color: var(--text);
      border: 1px solid var(--line);
      border-left: 5px solid var(--accent);
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 1.06rem;
      font-weight: 600;
      transition: transform 0.18s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .app-btn:nth-child(2) {
      border-left-color: var(--accent-2);
    }

    .app-btn:nth-child(3) {
      border-left-color: #8b3a00;
    }

    .app-btn:hover {
      transform: translateY(-2px);
      border-color: #d9be96;
      box-shadow: 0 10px 18px rgba(49, 27, 8, 0.12);
    }

    @media (max-width: 520px) {
      .header {
        padding: 14px 10px;
      }

      .header-inner {
        gap: 8px;
      }

      .header-logo {
        width: 40px;
        height: 40px;
        padding: 3px;
      }

      .header-eyebrow {
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        margin-bottom: 4px;
      }

      .page-wrap {
        padding: 16px;
      }

      .shell {
        padding: 20px;
        border-radius: 16px;
      }

      .app-btn {
        font-size: 0.98rem;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <img
        src="https://static.wixstatic.com/media/12520c_ae3718c47560446f86e35e0f69137e81~mv2.png"
        alt="ISKCON Logo"
        class="header-logo"
      >

      <div class="header-title-wrap">
        <div class="page-title">ISKCON NRJD Web Apps</div>
        <div class="header-eyebrow">ISKCON Magadi Main Road</div>
        <div class="subtitle">New Rajapur Jagannatha Dhama</div>
      </div>

      <img
        src="https://static.wixstatic.com/media/12520c_282ceb077df44b50a1c7dc789d00afff~mv2.png/v1/fill/w_96,h_84,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/SP_logo_transp_blk.png"
        alt="Jagannatha Logo"
        class="header-logo"
      >
    </div>
  </header>

  <div class="page-wrap">
  <main class="shell">
    <p class="subtitle">Select an app to continue</p>

    <div class="grid">
      <a class="app-btn" href="<?= morningUrl ?>">1. Morning Announcement</a>
      <a class="app-btn" href="<?= purushotamUrl ?>">2. Purushotam Month Prayers</a>
      <a class="app-btn" href="<?= (typeof aratiUrl !== 'undefined' && aratiUrl) ? aratiUrl : '?page=arati' ?>">3. Arati Plates</a>
    </div>
  </main>
  </div>
</body>
</html>
