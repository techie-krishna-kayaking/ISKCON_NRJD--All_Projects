# Nandotsav 2026 Letters Generator Configuration

# Input file names (files should be in the 'input' folder)
excel_file: "Nandotsav 2026.xlsx"
finalists_sheet: "top3"
fancydress_sheet: "fancydress"
template_file: "Nandotsav 2026 Finals.docx"

# Output folder
output_folder: "output"

# PDF Converter: 'word' (auto-detect), 'word-mac' (macOS), 'word-windows' (Windows), 'libreoffice'
pdf_converter: "word"

# Verbose output
verbose: false

# Clean output folder before generating
clean: false
