<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <link
      href="https://cdn.jsdelivr.net/npm/boxicons@2.0.9/css/boxicons.min.css"
      rel="stylesheet"
    />

    <script>
      function submitForm() {
        const submitButton = document.querySelector('input[type="submit"]');
        submitButton.disabled = true;
        submitButton.value = "Submitting...";

        const formData = {
          date: document.getElementById("date").value,
          area: document.getElementById("area").value,
          subArea: document.getElementById("sub-area").value,
          time: document.getElementById("time").value,
          host: document.getElementById("host").value,
          conductedBy: document.getElementById("conducted-by").value,
          typeOfProgram: document.getElementById("type-of-program").value,
          peopleCount: document.getElementById("people-count").value,
          lampCount: document.getElementById("lamp-count").value,
        };

        google.script.run
          .withSuccessHandler(() => {
            document.getElementById("form").reset();
            alert("Damodar Aarti Lamp counts recorded successfully!");
            submitButton.disabled = false;
            submitButton.value = "Submit";
          })
          .withFailureHandler((error) => {
            alert("Error: " + error.message);
            submitButton.disabled = false;
            submitButton.value = "Submit";
          })
          .submitData(formData);
      }
    </script>


    <style>
      * {
        padding: 0;
        margin: 0;
      }

      body {
        background-color: #f4f7f6;
      }

      header {
        text-align: center;
        font-family: "Times New Roman", Times, serif;
        font-weight: bolder;
        padding: 40px;
        background-color: #009eff;
        color: whitesmoke;
      }

      .left-logo {
        position: absolute;
        top: 25px;
        left: 15px;
        width: 92px;
        height: auto;
      }

      /* Target the right logo */
      .right-logo {
        position: absolute;
        top: 25px;
        right: 12px;
        width: 92px;
        height: auto;
        border-radius: 50%;
      }

      marquee {
        font-family: "Times New Roman", Times, serif;
        font-weight: bolder;
        font-size: large;
        color: blueviolet;
      }

      .sb h1 {
        color: #333;
        font-family: "Times New Roman", Times, serif;
        text-align: center;
      }

      /* Form Container */
      #form {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        margin: auto;
        transition: transform 0.4s ease-in-out, box-shadow 0.4s ease-in-out;
      }

      #form:hover {
        transform: scale(1.02);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      }

      /* Form Elements */
      label {
        font-size: 14px;
        font-weight: 600;
        display: block;
        margin-bottom: 10px;
        color: #333;
        transition: color 0.3s ease;
      }

      input,
      select {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 20px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        color: #555;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        background-color: #f9f9f9;
        overflow: hidden;
      }

      input:hover,
      select:hover {
        background-color: #f1f1f1;
      }

      input:focus,
      select:focus {
        border-color: #7dcdcf;
        box-shadow: 0 0 8px rgba(125, 205, 207, 0.8);
        outline: none;
      }

      input:focus {
        animation: glow 1.2s ease-in-out infinite alternate;
      }

      @keyframes glow {
        from {
          box-shadow: 0 0 8px rgba(92, 184, 92, 0.5);
        }
        to {
          box-shadow: 0 0 15px rgba(92, 184, 92, 1);
        }
      }

      /* Advanced Animation for Inputs */
      input,
      select {
        animation: fadeInUp 0.5s ease-in-out both;
      }

      @keyframes fadeInUp {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Submit Button */
      input[type="submit"] {
        background-color: #5cb85c;
        color: white;
        border: none;
        border-radius: 50px;
        padding: 15px 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.3s ease,
          box-shadow 0.3s ease;
        display: inline-block;
        width: 100%;
      }

      input[type="submit"]:hover {
        background-color: #4cae4c;
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(125, 205, 207, 0.3);
      }

      input[type="submit"]:active {
        transform: translateY(0);
        box-shadow: 0 5px 10px rgba(125, 205, 207, 0.2);
      }

      input[type="submit"]:focus {
        animation: buttonGlow 1.2s ease-in-out infinite alternate;
      }

      @keyframes buttonGlow {
        from {
          box-shadow: 0 0 10px rgba(92, 184, 92, 0.6);
        }
        to {
          box-shadow: 0 0 20px rgba(92, 184, 92, 1);
        }
      }

      footer {
        background-color: #333;
        color: #f9f9f9;
        padding: 20px 0;
        text-align: center;
      }

      /* Social Icons */
      .footer-social {
        margin-bottom: 20px;
      }

      .footer-social a {
        color: #f9f9f9;
        font-size: 24px;
        margin: 0 10px;
        transition: color 0.3s ease, transform 0.3s ease;
        display: inline-block;
      }

      .footer-social a:hover {
        color: #7dcdcf; /* Icon color change on hover */
        transform: scale(1.2); /* Icon grows slightly on hover */
      }

      /* Footer Bottom */
      .footer-bottom {
        padding: 10px 0;
        background-color: #222;
      }

      .footer-bottom p {
        font-size: 14px;
        margin: 0;
        color: #aaa;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        #form {
          padding: 20px;
          border-radius: 10px;
        }

        input,
        select {
          font-size: 14px;
          padding: 10px 12px;
        }

        input[type="submit"] {
          padding: 12px;
        }
      }

      @media (max-width: 480px) {
        #form {
          padding: 15px;
          max-width: 90%;
        }

        input,
        select {
          font-size: 13px;
          padding: 8px 10px;
        }

        input[type="submit"] {
          padding: 10px;
          font-size: 14px;
        }
      }

      /* For Extra Small Screens up to 320px */
      @media (max-width: 320px) {
        #form {
          padding: 10px;
          max-width: 100%;
        }

        input,
        select {
          font-size: 12px;
          padding: 6px 8px;
        }

        input[type="submit"] {
          padding: 8px;
          font-size: 13px;
        }
      }

      @media (max-width: 480px) {
        .footer-social a {
          font-size: 20px;
          margin: 0 8px;
        }

        .footer-bottom p {
          font-size: 12px;
        }
      }
    </style>
  </head>

      <label for="date">Date:</label>

      <label for="area">Area:</label>
      <select id="area" required>

        <option value="RT NAGAR">RT NAGAR</option>
        <option value="UDDHAVAPURI">UDDHAVAPURI</option>
        <option value="VIVEK NAGAR & ULSOOR">VIVEK NAGAR & ULSOOR</option>
        <option value="YERANDANAHALLI & SOUTH BANGALORE">YERANDANAHALLI & SOUTH BANGALORE</option>
        <option value="YELANKHA">YELANKHA</option></select
      ><br /><br />

      <label for="sub-area">Sub-Area:</label>
      <select id="sub-area" required>
        <option value="">-----Select Sub-Area-----</option>
        <option value="ANDRAHALLI">ANDRAHALLI</option>
        <option value="ANNASANDRAPALYA">ANNASANDRAPALYA</option>
        <option value="ATL">ATL</option>
        <option value="BAGALGUNTE">BAGALGUNTE</option>
        <option value="CHIKKA GOLROTTI">CHIKKA GOLROTTI</option>
        <option value="CHIKKABANAWARA">CHIKKABANAWARA</option>
        <option value="D-GROUP">D-GROUP</option>
        <option value="DASARAHALLI">DASARAHALLI</option>
        <option value="ISKCON NRJD">INRJD CENTER SURROUNDING</option>
        <option value="KAVALBYRASANDRA">KAVALBYRASANDRA</option>
        <option value="KENGERI">KENGERI</option>
        <option value="MACHO HALLI">MACHO HALLI</option>
        <option value="MERTA">MERTA</option>
        <option value="MAHAPRABHU ARMY">MAHAPRABHU ARMY</option>
        <option value="MODI GARDEN">MODI GARDEN</option>
        <option value="MOODAL PALYA">MOODAL PALYA</option>

        <option value="RAGHAVENDRA LAYOUT">RAGHAVENDRA LAYOUT</option>
        <option value="UPKAR LAYOUT">UPKAR LAYOUT</option>
        <option value="VIVEK NAGAR & ULSOOR">VIVEK NAGAR & ULSOOR</option>
        <option value="TUNGANAGAR">TUNGANAGAR</option>
        <option value="YELANKHA">YELANKHA</option></select
      ><br /><br />

      <label for="time">Time:</label>
      <input type="time" id="time" required /><br /><br />

      <label for="host">Host:</label>
      <input type="text" id="host" required /><br /><br />

      <label for="conducted-by">Conducted By:</label>
      <input type="text" id="conducted-by" required /><br /><br />

      <label for="type-of-program">Type of Program:</label>
      <select id="type-of-program" required>
        <option value="">-----Select Type of Program-----</option>
        <option value="DOOR TO DOOR">DOOR TO DOOR</option>
        <option value="EDUCATIONAL INSTITUTE">EDUCATIONAL INSTITUTE</option>
        <option value="HOME">HOME</option>
        <option value="INDIVIDUAL/FAMILY">INDIVIDUAL/FAMILY</option>
        <option value="OTHER">OTHER</option>
        <option value="TEMPLE">TEMPLE</option>
      </select>
      <br /><br />

      <label for="people-count">Devotee Count:</label>
      <input type="number" id="people-count" required min="0" /><br /><br />

      <label for="lamp-count">Lamp Count:</label>
      <input type="number" id="lamp-count" required min="0" /><br /><br />

      <input type="submit" value="Submit" />
    </form>
